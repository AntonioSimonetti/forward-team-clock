name: team-clock

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-clock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node clock.mjs
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEAM_JSON: ${{ secrets.TEAM_JSON }}
      - name: Save message id / monthly keep-alive
        run: |
          git config user.name "team-clock"
          git config user.email "team-clock@users.noreply.github.com"
          git add message_id.txt last_month.txt
          git diff --cached --quiet || (git commit -m "team clock: update state" && git push)
